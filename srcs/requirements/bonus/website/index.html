<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>aachata | Inception</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: Georgia, "Times New Roman", serif;
            background: #f4efe6;
            color: #2b2620;
            line-height: 1.6;
            padding: 48px 20px;
        }
        main { max-width: 820px; margin: 0 auto; }
        header { border-bottom: 3px solid #2b2620; padding-bottom: 20px; margin-bottom: 36px; }
        h1 { font-size: 2.6rem; letter-spacing: -1px; }
        h1 span { color: #b5472a; }
        header p { font-size: 1.1rem; color: #5c5449; margin-top: 6px; }
        h2 { font-size: 1.3rem; text-transform: uppercase; letter-spacing: 2px; margin: 32px 0 14px; color: #b5472a; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 14px; }
        .card { background: #fffdf9; border: 1px solid #d9d0c2; padding: 16px 18px; }
        .card strong { display: block; font-size: 1.05rem; margin-bottom: 4px; }
        .card small { color: #7a7065; }
        ul { padding-left: 20px; }
        li { margin-bottom: 6px; }
        code { font-family: Menlo, Consolas, monospace; background: #e9e1d3; padding: 1px 5px; border-radius: 3px; font-size: 0.9em; }
        footer { margin-top: 44px; border-top: 1px solid #d9d0c2; padding-top: 14px; color: #7a7065; font-size: 0.9rem; }
    </style>
</head>
<body>
<main>
    <h1>static website made by aachata</h1>
</main>
</body>
</html>
